# Tests of thimble's Copilot CLI port (copilot/). Upstream changes under plugin/ run them too, since the port reads
# upstream's prompts and modules by path.
name: copilot ci

on:
  push:
    paths:
      - 'copilot/**'
      - 'plugin/**'
      - '.github/workflows/copilot-*.yml'
  pull_request:
    paths:
      - 'copilot/**'
      - 'plugin/**'
      - '.github/workflows/copilot-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test copilot/test
